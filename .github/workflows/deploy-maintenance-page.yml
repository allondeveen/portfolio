name: Deploy Maintenance Page
on:
  workflow_dispatch:
jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        timeout-minutes: 3
      - name: Build
        id: build
        run: pnpm --filter @allondeveen-portfolio/maintenance build
        timeout-minutes: 3
      - name: Deploy
        run: "pnpm --filter @allondeveen-portfolio/maintenance run deploy"
        env:
          CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 5
